[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "node -e \"delete process.env.PRISMA_GENERATE_DATAPROXY; const { spawnSync } = require('child_process'); const res = spawnSync('npm', ['run', 'build'], { stdio: 'inherit', shell: true }); process.exit(res.status);\""
  publish = ".next"

[build.environment]
  PRISMA_GENERATE_DATAPROXY = "false"

[functions."*"]
  included_files = ["node_modules/@img/sharp-linux-x64/**", "node_modules/@img/sharp-libvips-linux-x64/**"]
  excluded_files = ["public/**", ".next/cache/**", "node_modules/@img/sharp-win32-x64/**"]
